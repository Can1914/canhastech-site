name: Deploy to Natro via FTP

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ format('{0}/', secrets.FTP_REMOTE_DIR) }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/.DS_Store
